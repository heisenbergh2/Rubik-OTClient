---
name: Tests - Lua

on:
  workflow_dispatch:
  workflow_call:

jobs:
  job:
    name: Run Lua Tests
    runs-on: ubuntu-latest

    steps:
      - name: Update
        run: sudo apt-get update

      - name: Setup Lua
        run: sudo apt-get install -y lua5.1 liblua5.1-0-dev luajit

      - name: Check out code.
        uses: actions/checkout@v7

      - name: Validate source and runtime asset integrity
        run: python3 tools/validate_repository.py

      - name: Test package creation and failure recovery
        run: python3 -B -m unittest discover -s tests/python -p 'test_*.py'

      - name: Check Lua source syntax
        run: |
          # The client uses LuaJIT, including its supported goto syntax.
          for file in init.lua otclientrc.lua meta.lua luajit_compile.lua; do
            luajit -b "$file" /dev/null
          done
          find data modules mods tools -name '*.lua' -print0 | xargs -0 -n1 sh -c 'luajit -b "$1" /dev/null' sh

      - name: Test OTUI editor parsing and edit safety
        run: lua5.1 tests/lua/dev_otui_test.lua

      - name: Test login loading-screen lifecycle
        run: lua5.1 tests/lua/login_transition_test.lua

      - name: Test options and runtime packaging contracts
        run: lua5.1 tests/lua/options_contract_test.lua

      - name: Test secure script loading, config extraction and Highscores lifecycle
        run: lua5.1 tests/lua/security_regression_test.lua
